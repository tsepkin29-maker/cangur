# Cangur — Netlify config.
#
# The Next.js adapter (OpenNext) is applied automatically by Netlify and
# kept up to date on every build — it is NOT pinned here on purpose, per
# Netlify's own guidance. Routing, SSR/RSC, Server Actions, ISR
# (revalidateTag / updateTag) and next/image optimization are all
# provisioned by that adapter. No [[plugins]], no publish dir, and no
# manual [[redirects]] for locale routing — the runtime owns all of it.
# This file only carries Node version + headers/caching.

[build]
  command = "npm run build"
  # The Next.js Runtime plugin serves SSR/RSC from the framework output.
  # An explicit publish dir is required so it isn't left equal to the repo
  # root (which the plugin rejects: "publish directory cannot be the same
  # as the base directory").
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# --- security headers (all routes) ----------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"

# --- caching ------------------------------------------------------------
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/shop/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- admin / api: never cached at the CDN, never indexed -----------------
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
